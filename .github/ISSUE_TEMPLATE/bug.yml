name: Bug report
description: Report a reproducible KeepKeys defect using synthetic data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never include a real secret. Security vulnerabilities belong in a private GitHub Security Advisory.
  - type: input
    id: version
    attributes:
      label: KeepKeys version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, vault provider, agent client, and client version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
