name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - if: runner.os != 'Windows'
        run: ./scripts/check
      - if: runner.os != 'Windows'
        run: ./scripts/test
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\check.ps1
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test.ps1

  native-vault:
    name: Native vault / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - if: runner.os == 'macOS'
        run: ./scripts/doctor
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\doctor.ps1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools python3-tk
          ./scripts/linux-ci-doctor

  package:
    name: Reproducible packages
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
      - run: ./scripts/package-submission
      - run: ./scripts/package-release
      - name: Verify byte-for-byte reproducible rebuilds
        shell: bash
        run: |
          version=$(node -p \
            "require('./plugins/keepkeys/.codex-plugin/plugin.json').version")
          submission="dist/keepkeys-skills-${version}.zip"
          release="dist/keepkeys-${version}-source.zip"
          submission_before=$(shasum -a 256 "$submission")
          release_before=$(shasum -a 256 "$release")
          ./scripts/package-submission >/dev/null
          ./scripts/package-release >/dev/null
          test "$submission_before" = "$(shasum -a 256 "$submission")"
          test "$release_before" = "$(shasum -a 256 "$release")"
      - name: Inspect release archives
        run: |
          version=$(node -p \
            "require('./plugins/keepkeys/.codex-plugin/plugin.json').version")
          unzip -l "dist/keepkeys-skills-${version}.zip"
          unzip -l "dist/keepkeys-${version}-source.zip"

  release-gate:
    name: Release gate
    if: always()
    needs: [verify, native-vault, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every proof job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          NATIVE_VAULT_RESULT: ${{ needs.native-vault.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$NATIVE_VAULT_RESULT" = success
          test "$PACKAGE_RESULT" = success
