name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: ./scripts/check
      - run: ./scripts/test
      - run: ./scripts/package-submission
      - run: ./scripts/package-release
      - run: unzip -l dist/keepkeys-skills-0.3.0.zip
      - run: unzip -l dist/keepkeys-0.3.0-source.zip
