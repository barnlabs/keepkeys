name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: ./scripts/check
      - run: ./scripts/test
      - run: ./scripts/package-submission
      - run: unzip -l dist/keep-keys-skills-0.1.0.zip
