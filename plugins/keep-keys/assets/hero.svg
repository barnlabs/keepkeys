<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">KeepKeys — local secrets for agents</title>
  <desc id="desc">A BarnLabs KeepKeys banner showing one secure local core connected to Codex, Claude Code, Oh My Pi, Hermes, and Gemini CLI.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#F5E8D1"/>
    </linearGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#FFF8EC" opacity=".035"/>
      <circle cx="23" cy="18" r="1" fill="#FFF8EC" opacity=".025"/>
    </pattern>
  </defs>
  <rect width="1280" height="560" rx="32" fill="#14211D"/>
  <rect width="1280" height="560" rx="32" fill="url(#grain)"/>
  <path d="M0 468C232 385 430 438 643 488s410 46 637-56v128H0z" fill="#1F2D27"/>

  <g transform="translate(72 72)">
    <path fill="#FFF8EC" d="M52 0 104 19v39c0 34-22 54-52 64C22 112 0 92 0 58V19z"/>
    <path fill="#D96C4D" d="M52 15 89 29v29c0 24-15 39-37 47-22-8-37-23-37-47V29z"/>
    <circle cx="52" cy="53" r="13" fill="#FFF8EC"/>
    <path fill="#FFF8EC" d="M46 64h12l6 25H40z"/>
  </g>

  <text x="204" y="142" fill="#FFF8EC" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="70" font-weight="750" letter-spacing="-3">KeepKeys</text>
  <text x="76" y="214" fill="#EFB28E" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing=".4">LOCAL SECRETS FOR THE AGENTS YOU TRUST</text>
  <text x="76" y="261" fill="#FFF8EC" opacity=".84" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="21">You type the key once. Your agent can use it, never retrieve it.</text>

  <g transform="translate(76 312)">
    <rect width="400" height="122" rx="22" fill="url(#paper)"/>
    <path fill="#1F2D27" d="M56 18 88 30v24c0 21-13 34-32 40-19-6-32-19-32-40V30z"/>
    <path fill="#D96C4D" d="M56 29 78 37v17c0 14-9 23-22 28-13-5-22-14-22-28V37z"/>
    <circle cx="56" cy="52" r="8" fill="#FFF8EC"/>
    <path fill="#FFF8EC" d="M52 59h8l4 15H48z"/>
    <text x="110" y="57" fill="#1F2D27" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="23" font-weight="700">One audited core</text>
    <text x="110" y="86" fill="#41544C" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="16">Native entry · Keychain · approval</text>
  </g>

  <path d="M500 374H573" fill="none" stroke="#D96C4D" stroke-width="3" stroke-linecap="round"/>
  <path d="m564 365 10 9-10 9" fill="none" stroke="#D96C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Avenir Next, Inter, Arial, sans-serif" font-size="17" font-weight="650">
    <g transform="translate(606 303)">
      <rect width="174" height="52" rx="26" fill="#FFF8EC"/>
      <circle cx="29" cy="26" r="7" fill="#D96C4D"/>
      <text x="51" y="32" fill="#1F2D27">Codex</text>
    </g>
    <g transform="translate(798 303)">
      <rect width="190" height="52" rx="26" fill="#FFF8EC"/>
      <circle cx="29" cy="26" r="7" fill="#D96C4D"/>
      <text x="51" y="32" fill="#1F2D27">Claude Code</text>
    </g>
    <g transform="translate(1006 303)">
      <rect width="194" height="52" rx="26" fill="#FFF8EC"/>
      <circle cx="29" cy="26" r="7" fill="#D96C4D"/>
      <text x="51" y="32" fill="#1F2D27">Oh My Pi</text>
    </g>
    <g transform="translate(688 377)">
      <rect width="174" height="52" rx="26" fill="#FFF8EC"/>
      <circle cx="29" cy="26" r="7" fill="#D96C4D"/>
      <text x="51" y="32" fill="#1F2D27">Hermes</text>
    </g>
    <g transform="translate(880 377)">
      <rect width="212" height="52" rx="26" fill="#FFF8EC"/>
      <circle cx="29" cy="26" r="7" fill="#D96C4D"/>
      <text x="51" y="32" fill="#1F2D27">Gemini CLI</text>
    </g>
  </g>

  <text x="76" y="512" fill="#FFF8EC" opacity=".58" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="15" letter-spacing="1.4">OPEN SOURCE · APACHE-2.0 · BARNLABS</text>
</svg>
